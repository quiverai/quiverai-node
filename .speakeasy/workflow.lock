    speakeasyVersion: latest
    sources:
        OpenAPI:
            inputs:
                - location: https://api.quiver.ai/v1/openapi.json
            overlays:
                - location: ./.speakeasy/svg-stream-forward-compat.overlay.yaml
            transformations:
                - filterOperations:
                    operations: createOpenResponse
                    exclude: true
                - removeUnused: true
            registry:
                location: registry.speakeasyapi.dev/quiverai/clients/open-api
    targets:
        '@quiverai/sdk':
            target: typescript
            source: OpenAPI
            output: .
            publish:
                npm:
                    token: $npm_token
            codeSamples:
                registry:
                    location: registry.speakeasyapi.dev/quiverai/clients/open-api-typescript-code-samples
                labelOverride:
                    fixedValue: Typescript (SDK)
                blocking: false
